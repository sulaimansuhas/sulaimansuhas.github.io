name: Deploy site

on:
  push:
    branches: [master]
  # Also started by the resume-repo build workflow after it publishes a release.
  workflow_dispatch:
  # Pick up pushed Obsidian changes without requiring a website commit.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # RESUME_TOKEN: fine-grained PAT with read-only Contents access to resume-repo.
      - name: Fetch latest resume
        env:
          GH_TOKEN: ${{ secrets.RESUME_TOKEN }}
        run: ./scripts/fetch-resume.sh

      - name: Check vault access configuration
        env:
          MORIA_TOKEN: ${{ secrets.MORIA_TOKEN }}
        run: |
          if [ -z "$MORIA_TOKEN" ]; then
            echo "::error::Add MORIA_TOKEN with read-only Contents access to sulaimansuhas/Moria."
            exit 1
          fi

      - name: Fetch shelf collections
        uses: actions/checkout@v4
        with:
          repository: sulaimansuhas/Moria
          ref: main
          token: ${{ secrets.MORIA_TOKEN }}
          path: .shelf-vault
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ReadingList/Books/*.md
            /WatchingList/Movies/*.md

      - name: Import books and films
        run: npm run import-shelf

      - name: Remove temporary vault checkout
        if: always()
        run: rm -rf -- .shelf-vault

      - name: Build
        run: npx gatsby build

      # enablement switches Pages to deploy from this workflow if it is not already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
